<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Evaluaciones - Instituto Superior RETOS</title>
    <!-- Fuente Google Fonts (Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Colores tomados directamente del logotipo */
            --primary-dark: #33522b;     /* Verde oscuro institucional */
            --accent-green: #7cb342;     /* Verde claro / lima */
            --bg-light: #f5f3e9;         /* Crema claro del fondo del logo */
            --card-bg: #ffffff;          /* Blanco de la tarjeta */
            --text-color: #263b20;       /* Texto oscuro */
            --text-muted: #5e6c58;      /* Texto secundario */
            --hover-dark: #243c1e;       /* Hover oscuro para botones */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-light);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 480px;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 12px 35px rgba(51, 82, 43, 0.08);
            border: 1px solid rgba(51, 82, 43, 0.1);
            text-align: center;
        }

        .brand-header {
            margin-bottom: 25px;
        }

        .logo-img {
            max-width: 280px;
            width: 100%;
            height: auto;
            margin-bottom: 15px;
        }

        .brand-header p {
            font-size: 14px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .divider {
            height: 3px;
            width: 50px;
            background-color: var(--accent-green);
            margin: 15px auto 25px auto;
            border-radius: 2px;
        }

        .buttons-wrapper {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .btn-evaluation {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: var(--primary-dark);
            color: #ffffff;
            text-decoration: none;
            padding: 16px 20px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 14px rgba(51, 82, 43, 0.2);
            border: 2px solid transparent;
        }

        .btn-evaluation:hover {
            background-color: var(--hover-dark);
            border-color: var(--accent-green);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(51, 82, 43, 0.3);
        }

        .btn-evaluation:active {
            transform: translateY(0);
        }

        .btn-icon {
            width: 20px;
            height: 20px;
            fill: currentColor;
            color: var(--accent-green);
            transition: transform 0.3s ease;
        }

        .btn-evaluation:hover .btn-icon {
            transform: translateX(4px);
        }

        .footer {
            margin-top: 35px;
            font-size: 12px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Encabezado con Logotipo -->
        <header class="brand-header">
            <!-- Coloca aquí el nombre exacto del archivo de la imagen de tu logo -->
            <img src="logotipo instituto retos-04.png" alt="Instituto Superior RETOS" class="logo-img">
            <div class="divider"></div>
            <p>Portal Institucional de Evaluaciones</p>
        </header>

        <!-- Enlaces a las evaluaciones -->
        <main class="buttons-wrapper">
            
            <a href="https://forms.cloud.microsoft/r/0Z6P1Cekzt" target="_blank" class="btn-evaluation">
                <span>Evaluación de Comprensión Lectora</span>
                <svg class="btn-icon" viewBox="0 0 24 24">
                    <path d="M5 12h14M12 5l7 7-7 7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </a>

            <a href="https://forms.cloud.microsoft/r/KKgVA731V4" target="_blank" class="btn-evaluation">
                <span>Evaluación de Personalidad</span>
                <svg class="btn-icon" viewBox="0 0 24 24">
                    <path d="M5 12h14M12 5l7 7-7 7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </a>

            <a href="https://forms.cloud.microsoft/r/KKgVA731V4" target="_blank" class="btn-evaluation">
                <span>Evaluación de Matemática</span>
                <svg class="btn-icon" viewBox="0 0 24 24">
                    <path d="M5 12h14M12 5l7 7-7 7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </a>

        </main>

        <!-- Pie de página -->
        <footer class="footer">
            <p>&copy; Instituto Especializado de Nivel Superior RETOS. Todos los derechos reservados.</p>
        </footer>
    </div>

</body>
</html>
