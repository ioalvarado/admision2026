<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Evaluaciones - Instituto Superior RETOS</title>
    <!-- Fuente elegante Google Fonts (Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #0d2b45;    /* Azul institucional */
            --secondary-color: #203c56;  /* Azul secundario */
            --accent-color: #d4af37;     /* Dorado elegante */
            --bg-color: #f4f6f9;         /* Gris claro de fondo */
            --card-bg: #ffffff;          /* Blanco puro para contenedor */
            --text-color: #2c3e50;       /* Texto oscuro */
            --text-muted: #6c757d;      /* Texto secundario */
            --hover-color: #1a365d;      /* Hover botón */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 480px;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(0, 0, 0, 0.05);
            text-align: center;
        }

        .brand-header {
            margin-bottom: 30px;
        }

        .brand-header h2 {
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent-color);
            margin-bottom: 8px;
        }

        .brand-header h1 {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 8px;
        }

        .brand-header p {
            font-size: 14px;
            color: var(--text-muted);
            font-weight: 400;
        }

        .divider {
            height: 3px;
            width: 50px;
            background-color: var(--accent-color);
            margin: 20px auto 30px auto;
            border-radius: 2px;
        }

        .buttons-wrapper {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .btn-evaluation {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: var(--primary-color);
            color: #ffffff;
            text-decoration: none;
            padding: 16px 20px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 500;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(13, 43, 69, 0.15);
        }

        .btn-evaluation:hover {
            background-color: var(--hover-color);
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(13, 43, 69, 0.25);
        }

        .btn-evaluation:active {
            transform: translateY(0);
        }

        .btn-icon {
            width: 20px;
            height: 20px;
            fill: currentColor;
            opacity: 0.8;
            transition: transform 0.3s ease;
        }

        .btn-evaluation:hover .btn-icon {
            transform: translateX(4px);
            opacity: 1;
        }

        .footer {
            margin-top: 35px;
            font-size: 12px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Encabezado Institucional -->
        <header class="brand-header">
            <h2>Instituto Superior</h2>
            <h1>RETOS</h1>
            <div class="divider"></div>
            <p>Portal Institucional de Evaluaciones</p>
        </header>

        <!-- Enlaces a evaluaciones -->
        <main class="buttons-wrapper">
            
            <a href="https://forms.cloud.microsoft/r/0Z6P1Cekzt" target="_blank" class="btn-evaluation">
                <span>Evaluación de Comprensión Lectora</span>
                <svg class="btn-icon" viewBox="0 0 24 24">
                    <path d="M5 12h14M12 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </a>

            <a href="https://forms.cloud.microsoft/r/KKgVA731V4" target="_blank" class="btn-evaluation">
                <span>Evaluación de Personalidad</span>
                <svg class="btn-icon" viewBox="0 0 24 24">
                    <path d="M5 12h14M12 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </a>

            <a href="https://forms.cloud.microsoft/r/KKgVA731V4" target="_blank" class="btn-evaluation">
                <span>Evaluación de Matemática</span>
                <svg class="btn-icon" viewBox="0 0 24 24">
                    <path d="M5 12h14M12 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </a>

        </main>

        <!-- Pie de página -->
        <footer class="footer">
            <p>&copy; Instituto Superior RETOS. Todos los derechos reservados.</p>
        </footer>
    </div>

</body>
</html>
